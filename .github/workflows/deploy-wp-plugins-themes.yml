name: Deploy WP plugins & themes to Hostinger (dry-run by default, safe debug)

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      live:
        description: 'Set to "true" to perform real deploy (default=false)'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Use repository-level secrets (preferred). Remove `environment:` if you don't use environment-scoped secrets.
    # environment: staging

    env:
      REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
      REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
      REMOTE_PLUGINS_PATH: ${{ secrets.TARGET_PLUGINS_PATH }}
      REMOTE_THEMES_PATH: ${{ secrets.TARGET_THEMES_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client coreutils

      - name: Debug: ensure required secrets exist and print safe metadata
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" ]; then
            echo "ERROR: secret HOSTINGER_SSH_KEY_B64 is missing or empty"
            exit 1
          fi
          if [ -z "${{ secrets.HOSTINGER_HOST }}" ]; then
            echo "ERROR: secret HOSTINGER_HOST is missing or empty"
            exit 1
          fi
          if [ -z "${{ secrets.HOSTINGER_USER }}" ]; then
            echo "ERROR: secret HOSTINGER_USER is missing or empty"
            exit 1
          fi
          echo "HOSTINGER_HOST = ${{ secrets.HOSTINGER_HOST }}"
          echo "HOSTINGER_USER = ${{ secrets.HOSTINGER_USER }}"
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" | wc -c | awk '{print "HOSTINGER_SSH_KEY_B64 length:", $1}'
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" | sha256sum | awk '{print "HOSTINGER_SSH_KEY_B64 sha256:", $1}'
        shell: bash

      - name: Configure SSH key (decode base64 -> id_rsa) and start ssh-agent
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Decode base64 secret into private key
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Start ssh-agent and add the key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          # Add host fingerprint for non-interactive SSH
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts || true
          echo "SSH key loaded and known_hosts updated."
        shell: bash

      - name: Ensure remote target directories exist
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.HOSTINGER_USER }}"@"${{ secrets.HOSTINGER_HOST }}" "mkdir -p '${{ secrets.TARGET_PLUGINS_PATH }}' '${{ secrets.TARGET_THEMES_PATH }}' && echo 'remote paths ensured'"
        shell: bash

      - name: Rsync plugins (dry-run by default)
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            DRY_FLAG=""
            echo "Running REAL deploy for plugins."
          else
            DRY_FLAG="--dry-run"
            echo "Running DRY-RUN for plugins."
          fi
          rsync -avz --delete $DRY_FLAG --exclude='.git' --exclude='node_modules' --exclude='wp-config.php' --exclude='wp-content/uploads' ./wp-content/plugins/ "${{ secrets.HOSTINGER_USER }}"@"${{ secrets.HOSTINGER_HOST }}":"${{ secrets.TARGET_PLUGINS_PATH }}/"
        shell: bash

      - name: Rsync themes (dry-run by default)
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            DRY_FLAG=""
            echo "Running REAL deploy for themes."
          else
            DRY_FLAG="--dry-run"
            echo "Running DRY-RUN for themes."
          fi
          rsync -avz --delete $DRY_FLAG --exclude='.git' --exclude='node_modules' --exclude='wp-config.php' --exclude='wp-content/uploads' ./wp-content/themes/ "${{ secrets.HOSTINGER_USER }}"@"${{ secrets.HOSTINGER_HOST }}":"${{ secrets.TARGET_THEMES_PATH }}/"
        shell: bash

      - name: Post-deploy tasks (only on live)
        if: ${{ github.event.inputs.live == 'true' }}
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.HOSTINGER_USER }}"@"${{ secrets.HOSTINGER_HOST }}" <<'REMOTE_CMDS'
          chown -R u689060721:u689060721 "${{ secrets.TARGET_PLUGINS_PATH }}" || true
          chown -R u689060721:u689060721 "${{ secrets.TARGET_THEMES_PATH }}" || true
          if command -v wp >/dev/null 2>&1; then
            wp cache flush --path=/home/u689060721/domains/lightsteelblue-dolphin-977863.hostingersite.com/public_html --allow-root || true
          fi
          echo "Remote post-deploy tasks finished."
REMOTE_CMDS
        shell: bash

      - name: Summary
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            echo "LIVE deployment executed."
          else
            echo "DRY-RUN completed. Re-run this workflow with input live=true to perform real deploy."
          fi
        shell: bash
