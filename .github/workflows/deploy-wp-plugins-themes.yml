name: Deploy WP plugins & themes to Hostinger (rsync via SSH - dry run)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
      REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
      REMOTE_PLUGINS_PATH: ${{ secrets.TARGET_PLUGINS_PATH }}
      REMOTE_THEMES_PATH: ${{ secrets.TARGET_THEMES_PATH }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Debug: ensure required secrets exist
        run: |
          echo "Checking secrets..."
          if [ -z "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" ]; then
            echo "ERROR: HOSTINGER_SSH_KEY_B64 is missing or empty"
            exit 1
          fi
          if [ -z "${{ secrets.HOSTINGER_HOST }}" ]; then
            echo "ERROR: HOSTINGER_HOST is missing or empty"
            exit 1
          fi
          if [ -z "${{ secrets.HOSTINGER_USER }}" ]; then
            echo "ERROR: HOSTINGER_USER is missing or empty"
            exit 1
          fi
          echo "Secrets OK."

      - name: Configure SSH key (decode base64) and start ssh-agent
        run: |
          set -e
          mkdir -p ~/.ssh
          # Decode base64 secret into private key
          echo "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Start ssh-agent and add key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          # Add host fingerprint to known_hosts to avoid prompts
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote target directories exist
        run: |
          ssh -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p '${REMOTE_PLUGINS_PATH}' '${REMOTE_THEMES_PATH}'"

      - name: Rsync plugins folder (DRY-RUN)
        run: |
          echo "---- DRY RUN: Plugins ----"
          rsync -avz --delete --dry-run \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='wp-config.php' \
            --exclude='wp-content/uploads' \
            ./wp-content/plugins/ \
            "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PLUGINS_PATH/"

      - name: Rsync themes folder (DRY-RUN)
        run: |
          echo "---- DRY RUN: Themes ----"
          rsync -avz --delete --dry-run \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='wp-config.php' \
            --exclude='wp-content/uploads' \
            ./wp-content/themes/ \
            "$REMOTE_USER@$REMOTE_HOST:$REMOTE_THEMES_PATH/"

      - name: Post-deploy (DRY-RUN)
        run: echo "Dry-run finished. If output looks correct, remove --dry-run flags from rsync commands and re-run for a real deploy."
