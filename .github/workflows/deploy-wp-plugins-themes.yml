name: Deploy WP plugins & themes to Hostinger (staging - fixed remote paths)

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # required secrets (still keep these as secrets in repo settings)
      HOST: ${{ secrets.HOSTINGER_HOST }}
      USER: ${{ secrets.HOSTINGER_USER }}
      KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY }}
      PORT_SECRET: ${{ secrets.HOSTINGER_SSH_PORT }}

      # --- Hard-coded remote paths (replace with your actual absolute paths) ---
      HOST: 109.106.254.234
      USER: u689060721
      KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY }}
      PORT_SECRET: "65002"
      PLUGINS_PATH: /home/u689060721/domains/lightsteelblue-dolphin-977863.hostingersite.com/public_html/wp-content/plugins
      THEMES_PATH:  /home/u689060721/domains/lightsteelblue-dolphin-977863.hostingersite.com/public_html/wp-content/themes
      # ----------------------------------------------------------------------------

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client coreutils

      - name: Show working dir files (verify repo content)
        run: |
          echo "Repo root contents:"
          ls -lah
          echo "wp-content/plugins (if present):"
          ls -lah ./wp-content/plugins || echo "no plugins folder"
          echo "wp-content/themes (if present):"
          ls -lah ./wp-content/themes || echo "no themes folder"

      - name: Validate required secrets and compute SSH port
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "ERROR: HOSTINGER_SSH_KEY missing - add repo secret"
            exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "ERROR: HOSTINGER_HOST missing - add repo secret"
            exit 1
          fi
          if [ -z "$USER" ]; then
            echo "ERROR: HOSTINGER_USER missing - add repo secret"
            exit 1
          fi
          # PLUGINS_PATH and THEMES_PATH are hard-coded above in env, so no secret required
          # default port
          PORT="${PORT_SECRET:-65002}"
          echo "SSH port set to: $PORT"
          echo "SSH_PORT=$PORT" >> $GITHUB_ENV
        shell: bash

      - name: Decode private key, load ssh-agent and add host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # sanitize/strip CRs then decode
          CLEAN_B64=$(printf '%s' "$KEY_B64" | tr -d '\r')
          # validate basic base64 characters
          if ! printf '%s' "$CLEAN_B64" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            echo "ERROR: HOSTINGER_SSH_KEY is not valid base64. Recreate with: cat id_rsa | base64 | tr -d '\n'"
            exit 1
          fi
          printf '%s' "$CLEAN_B64" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          # record host key for custom port
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts || true
          echo "SSH key loaded and known_hosts updated for $HOST:$SSH_PORT"
        shell: bash

      - name: Ensure remote target directories exist
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "mkdir -p '$PLUGINS_PATH' '$THEMES_PATH' && echo 'remote paths ensured'"
        shell: bash

      - name: Rsync plugins → remote (production copy)
        run: |
          RSYNC_SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=no"
          rsync -e "$RSYNC_SSH" -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='wp-config.php' \
            --exclude='wp-content/uploads' \
            ./wp-content/plugins/ "$USER@$HOST:$PLUGINS_PATH/"
        shell: bash

      - name: Rsync themes → remote (production copy)
        run: |
          RSYNC_SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=no"
          rsync -e "$RSYNC_SSH" -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='wp-config.php' \
            --exclude='wp-content/uploads' \
            ./wp-content/themes/ "$USER@$HOST:$THEMES_PATH/"
        shell: bash

      - name: Finalize & mark pipeline passed
        run: |
          echo "Plugins and themes successfully synced to $USER@$HOST"
          echo "Pipeline passed."
        shell: bash
