name: Deploy WP plugins & themes to Hostinger (rsync action)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy plugins (dry-run)
        uses: burnett01/rsync-deployments@v3
        with:
          switches: -avz --delete --dry-run --exclude='.git' --exclude='node_modules' --exclude='wp-config.php' --exclude='wp-content/uploads'
          path: ./wp-content/plugins/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}
          remote_path: ${{ secrets.TARGET_PLUGINS_PATH }}

      - name: Deploy themes (dry-run)
        uses: burnett01/rsync-deployments@v3
        with:
          switches: -avz --delete --dry-run --exclude='.git' --exclude='node_modules' --exclude='wp-config.php' --exclude='wp-content/uploads'
          path: ./wp-content/themes/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}
          remote_path: ${{ secrets.TARGET_THEMES_PATH }}

      - name: If dry-run looks good, retry with real deploy (manual edit)
        run: echo "If dry-run output looks good, remove --dry-run from switches and re-run."

      - name: Fix ownership & flush cache (optional)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "chown -R u689060721:u689060721 ${{ secrets.TARGET_PLUGINS_PATH }} || true; chown -R u689060721:u689060721 ${{ secrets.TARGET_THEMES_PATH }} || true; if command -v wp >/dev/null 2>&1; then wp cache flush --path=/home/u689060721/domains/lightsteelblue-dolphin-977863.hostingersite.com/public_html --allow-root || true; fi"
