name: Deploy WP plugins & themes to Hostinger (rsync via SSH)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsync (if missing)
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote target directories exist
        run: |
          ssh -o StrictHostKeyChecking=no ${ { secrets.HOSTINGER_USER } }@${{ secrets.HOSTINGER_HOST }} "mkdir -p '${{ secrets.TARGET_PLUGINS_PATH }}' '${{ secrets.TARGET_THEMES_PATH }}'"

      - name: Rsync plugins folder (DRY-RUN)
        run: |
          echo "---- DRY RUN: Plugins ----"
          rsync -avz --delete --dry-run \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='wp-config.php' \
            --exclude='wp-content/uploads' \
            ./wp-content/plugins/ \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.TARGET_PLUGINS_PATH }}/"

      - name: Rsync themes folder (DRY-RUN)
        run: |
          echo "---- DRY RUN: Themes ----"
          rsync -avz --delete --dry-run \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='wp-config.php' \
            --exclude='wp-content/uploads' \
            ./wp-content/themes/ \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.TARGET_THEMES_PATH }}/"

      - name: Confirm and run real deploy (manual step)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging' }}
        run: |
          echo "If the dry-run output looks good, re-run this workflow with the '--live' input or edit this file and remove --dry-run."
