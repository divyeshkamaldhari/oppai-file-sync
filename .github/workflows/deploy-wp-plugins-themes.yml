name: Deploy WP plugins & themes to Hostinger

# trigger manually or on push to staging branch
on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add host to known_hosts
        # Ensures ssh won't ask to confirm host key interactively
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote paths exist
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "mkdir -p '${{ secrets.TARGET_PLUGINS_PATH }}' '${{ secrets.TARGET_THEMES_PATH }}'"

      - name: Rsync plugins folder to Hostinger
        run: |
          echo "Deploying plugins..."
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'wp-config.php' \
            --exclude 'wp-content/uploads' \
            ./wp-content/plugins/ \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.TARGET_PLUGINS_PATH }}/

      - name: Rsync themes folder to Hostinger
        run: |
          echo "Deploying themes..."
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'wp-config.php' \
            --exclude 'wp-content/uploads' \
            ./wp-content/themes/ \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.TARGET_THEMES_PATH }}/

      - name: Set ownership & clear cache (optional)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} <<'SSH_CMDS'
            # adjust user/group if different (www-data/nginx/apache)
            chown -R u689060721:u689060721 /home/u689060721/domains/lightsteelblue-dolphin-977863.hostingersite.com/public_html/wp-content/plugins || true
            chown -R u689060721:u689060721 /home/u689060721/domains/lightsteelblue-dolphin-977863.hostingersite.com/public_html/wp-content/themes || true

            # if WP-CLI is available, flush cache (optional)
            if command -v wp >/dev/null 2>&1; then
              wp cache flush --path=/home/u689060721/domains/lightsteelblue-dolphin-977863.hostingersite.com/public_html --allow-root || true
            fi
SSH_CMDS

      - name: Success Notification
        run: echo "Deployment finished."
